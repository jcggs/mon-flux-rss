name: Update RSS Feeds

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# ÉTAPE CLÉ : Donne l'autorisation à GitHub Actions d'écrire et modifier vos fichiers XML
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Version mise à jour v3 -> v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Version mise à jour v4 -> v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt lxml

      # Exécution sécurisée : même si un script échoue, les autres continuent
      # et le commit final aura quand même lieu pour les fichiers réussis.
      - name: Run Scrapers
        run: |
          python scraper.py || echo "Échec scraper.py"
          python telerama.py || echo "Échec telerama.py"
          python sudouest.py || echo "Échec sudouest.py"
          python radiofrance.py || echo "Échec radiofrance.py"

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Robot"
          git config --global user.email "actions@github.com"
          git add flux.xml telerama_gratuit.xml sudouest_gratuit.xml radiofrance.xml
          git commit -m "Mise à jour des flux RSS propres [skip ci]" || exit 0
          git push
